<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cagliari Trip Planner</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Your custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Bootstrap 5 Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-geo-alt-fill me-2"></i>
                Cagliari Trip Planner
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-house-door me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-map me-1"></i> Points of Interest</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="main-container">
        <!-- Route Input Panel -->
        <div id="route-panel">
            <button class="btn btn-sm toggle-panel" id="toggle-panel">
                <i class="bi bi-chevron-left"></i>
            </button>
            <h5><i class="bi bi-signpost-split"></i> Route Planner</h5>
            <hr>

            <form id="route-form" action="/api/calculate-route" method="POST" target="route-response-iframe">
                <div class="mb-3">
                    <label for="origin" class="form-label">Starting Point</label>
                    <div class="input-group input-with-autocomplete">
                        <input type="text" class="form-control" id="origin" name="origin"
                            placeholder="Da dove vuoi partire?" required autocomplete="off">
                        <input type="hidden" id="origin-coords" name="origin_coords">
                        <button class="btn btn-outline-secondary" id="locate-me" type="button"
                            title="Use my current location">
                            <i class="bi bi-geo-alt"></i>
                        </button>
                        <div id="origin-autocomplete" class="autocomplete-items"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="destination" class="form-label">Destination</label>
                    <div class="input-with-autocomplete">
                        <input type="text" class="form-control" id="destination" name="destination"
                            placeholder="Dove vuoi andare?" required autocomplete="off">
                        <input type="hidden" id="destination-coords" name="destination_coords">
                        <div id="destination-autocomplete" class="autocomplete-items"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="trip-date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="trip-date" name="trip_date" required>
                </div>

                <div class="mb-3">
                    <label for="trip-time" class="form-label">Time</label>
                    <input type="time" class="form-control" id="trip-time" name="trip_time" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-send"></i> Calculate Route
                </button>
            </form>
        </div>


        <!-- Shiny Map in iframe -->
        <iframe id="shiny-iframe" src="{{ shiny_url }}" style="width:100%; height:100%; border:none;"></iframe>
        <iframe name="route-response-iframe" id="route-response-iframe" style="display: none;"></iframe>

    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JS files -->
    <script src="/static/js/autocomplete.js" type="module"></script>
    <script src="/static/js/main.js" type="module"></script>

    <script>
        // Panel toggle functionality
        const togglePanel = document.getElementById('toggle-panel');
        if (togglePanel) {
            togglePanel.addEventListener('click', function () {
                document.getElementById('route-panel').classList.toggle('collapsed');
                this.querySelector('i').classList.toggle('bi-chevron-left');
                this.querySelector('i').classList.toggle('bi-chevron-right');
            });
        }

        // Chat panel toggle functionality (optional UI: guard if elements are not present)
        const toggleChat = document.getElementById('toggle-chat');
        const chatPanel = document.getElementById('chat-panel');
        if (toggleChat && chatPanel) {
            toggleChat.addEventListener('click', function () {
                chatPanel.classList.toggle('collapsed');
                this.querySelector('i').classList.toggle('bi-chevron-right');
                this.querySelector('i').classList.toggle('bi-chevron-left');
            });
        }
    </script>
</body>

</html>
